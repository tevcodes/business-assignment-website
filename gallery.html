<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/gallery.css">
    <!-- Preconnect: warms up DNS + TCP + TLS to Google's font servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- The font itself — only the weights we need -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800&display=swap" rel="stylesheet">   
    <title>Our Projects | Construction Company</title>
</head>
<body>
    <h1>Gallery</h1>
    <!-- Header -->

    <main>
    <!--Main Content-->
        <section class="gallery-intro">
            <h2>Our Projects</h2>
            <p>
                Explore our construction projects, from residential homes to commercial developments and renovations.
            </p>
        </section>

        <!--Project Gallery-->
        <section class="project-gallery" aria-label="Our construction projects">
            <article class="project-card">
                <img 
                src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=900&q=90"
                alt="Modern residential house with a landscaped garden"
                >
                <div class="project-card-content">
                    <h3>Modern Residential Home</h3>
                    <p>A contemporary home designed with comfort, functionality, and quality finishes in mind</p>
                    <span class="project-category">Residential</span>
                </div>
            </article>

    </main>

    <!-- Footer -->
</body>
</html>
